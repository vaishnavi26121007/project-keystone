# ==============================
# Project KEYSTONE - Application Configuration
# ==============================

spring.application.name=keystone

# --- Server ---
server.port=8080

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/keystone_db
spring.datasource.username=postgres
spring.datasource.password=Vaish@1012
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# IMPORTANT: replace this secret before deploying anywhere beyond local/academic use
keystone.jwt.secret=ZidioKeystoneSecretKeyForJWTSigning_ChangeThisInProduction_2026
keystone.jwt.expiration-ms=86400000

# --- Logging ---
logging.level.com.zidio.keystone=DEBUG
logging.level.org.springframework.security=INFO
